[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-research-agent"
version = "0.1.0"
description = "Human-reviewed academic literature research with traceable evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "langchain-openai>=1.0,<2", "httpx[socks]>=0.27,<1", "pydantic>=2.8,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
viz = ["matplotlib>=3.8,<4"]

[project.scripts]
scholar-agent = "scholar_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
